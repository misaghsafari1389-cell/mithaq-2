<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=1920,height=1080"><style>
*{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;overflow:hidden;font-family:Tahoma,Arial,sans-serif;background:#031a14;color:#f4ead5}.stage{width:100%;height:100%;position:relative;overflow:hidden;background:radial-gradient(ellipse at 70% 35%,#1b5d43 0%,#09271f 45%,#02140f 100%)}.stage:before{content:'';position:absolute;inset:-40%;background:conic-gradient(from 150deg at 68% 38%,transparent 0 24%,#d6b66c18 27%,transparent 33%,#8fc4a40d 42%,transparent 53%);transform:rotate(-12deg);filter:blur(18px)}.grid{position:absolute;inset:48% -10% -30%;background:linear-gradient(#d6b66c22 1px,transparent 1px),linear-gradient(90deg,#d6b66c22 1px,transparent 1px);background-size:72px 72px;transform:perspective(500px) rotateX(63deg);transform-origin:center top;opacity:.33}.brandline{position:absolute;top:58px;left:90px;right:90px;display:flex;justify-content:space-between;align-items:center;z-index:5;border-bottom:1px solid #d6b66c55;padding-bottom:20px}.brand{display:flex;align-items:center;gap:18px;font-size:34px;font-weight:800}.brand img{width:62px;height:62px;object-fit:contain;filter:drop-shadow(0 8px 12px #0008)}.eyebrow{font-size:22px;color:#d6b66c;letter-spacing:.14em}.copy{position:absolute;right:135px;top:300px;width:620px;z-index:4}.copy h1{font-size:72px;line-height:1.45;margin:0 0 22px;text-shadow:0 14px 28px #0008}.copy h1 span{color:#d6b66c}.copy p{font-size:30px;line-height:1.8;color:#c5d9c9}.rule{height:6px;width:170px;border-radius:5px;background:#d6b66c;box-shadow:0 0 30px #d6b66c99}.phone-wrap{position:absolute;left:220px;top:170px;width:600px;height:830px;perspective:1400px;z-index:3}.phone{position:relative;width:460px;height:760px;margin:auto;border:12px solid #162b25;border-radius:58px;background:#0a1713;box-shadow:-35px 50px 70px #000b,0 0 0 2px #d6b66c55,0 0 50px #d6b66c33;transform:rotateY(18deg) rotateX(4deg) rotateZ(-3deg);overflow:hidden}.phone:before{content:'';position:absolute;inset:0;background:linear-gradient(115deg,#ffffff28 0 12%,transparent 25% 66%,#d6b66c18 80%,transparent 90%);z-index:5;pointer-events:none}.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:180px;height:35px;background:#162b25;border-radius:0 0 20px 20px;z-index:4}.screen{position:absolute;inset:12px;border-radius:46px;overflow:hidden;background:#f4ead5;color:#16372e;padding:58px 25px 25px}.screen-head{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #cbd5c7;padding-bottom:16px}.screen-brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px}.screen-brand img{width:34px;height:34px}.screen h2{font-size:28px;color:#123b2e;margin:35px 0 20px}.field{margin:14px 0}.field label{display:block;font-size:15px;font-weight:700;margin-bottom:7px}.input{border:1px solid #d8ded4;background:#fffdf8;border-radius:9px;padding:12px;font-size:15px}.rec{background:#e6eee5;padding:15px;border-radius:12px;margin-top:18px}.wave{height:75px;display:flex;align-items:center;justify-content:center;gap:4px}.wave i{width:5px;background:#1b6348;border-radius:5px}.wave i:nth-child(1){height:22px}.wave i:nth-child(2){height:43px}.wave i:nth-child(3){height:65px}.wave i:nth-child(4){height:36px}.wave i:nth-child(5){height:58px}.wave i:nth-child(6){height:42px}.wave i:nth-child(7){height:28px}.wave i:nth-child(8){height:54px}.wave i:nth-child(9){height:34px}.wave i:nth-child(10){height:62px}.wave i:nth-child(11){height:40px}.wave i:nth-child(12){height:26px}.pill{display:inline-block;margin-top:8px;background:#123b2e;color:#fff;padding:8px 12px;border-radius:8px;font-size:14px}.pin{color:#567264;font-size:14px;margin-top:12px}.success-card{position:absolute;left:210px;top:270px;width:620px;padding:45px;text-align:center;background:#fffdf8;color:#16372e;border-radius:25px;box-shadow:0 35px 100px #0009;z-index:4}.check{width:92px;height:92px;border-radius:50%;display:grid;place-items:center;background:#dfece1;color:#286049;font-size:62px;margin:0 auto 18px}.success-card h2{font-size:42px;color:#123b2e;margin:10px 0}.code{display:inline-block;background:#f0f4eb;border-radius:10px;padding:13px 24px;letter-spacing:4px;font-size:26px;margin-top:12px}.notification{position:absolute;left:145px;top:160px;width:410px;padding:18px 22px;border:1px solid #d6b66c88;border-radius:18px;background:#163d30e6;box-shadow:0 20px 55px #0008;z-index:5}.notification strong{display:block;font-size:21px;color:#f4ead5;margin-bottom:6px}.notification span{font-size:17px;color:#c5d9c9}.particle{position:absolute;width:6px;height:6px;background:#d6b66c;border-radius:50%;box-shadow:0 0 18px #d6b66c}.p1{left:15%;top:24%}.p2{left:40%;top:76%}.p3{left:84%;top:22%}.p4{left:72%;top:80%}
</style></head><body><div id="root"></div><script>
const root=document.querySelector('#root'),scene=Number(new URLSearchParams(location.search).get('scene')||0),logo='../assets/mithaq2-icon-192.png';
const chrome=`<div class="brandline"><div class="brand"><img src="${logo}"><span>میثاق ۲</span></div><div class="eyebrow">سامانه رسمی ثبت گزارش صوتی</div></div><div class="grid"></div><i class="particle p1"></i><i class="particle p2"></i><i class="particle p3"></i><i class="particle p4"></i>`;
const phone=`<div class="phone-wrap"><div class="phone"><div class="notch"></div><div class="screen"><div class="screen-head"><div class="screen-brand"><img src="${logo}">میثاق ۲</div><span style="font-size:13px;color:#87988b">ثبت گزارش</span></div><h2>ثبت گزارش جدید</h2><div class="field"><label>عنوان گزارش *</label><div class="input">ثبت گزارش جلسه</div></div><div class="field"><label>سطح فوریت *</label><div class="input">ضروری</div></div><div class="rec"><label style="font-size:15px;font-weight:700">ضبط صدا</label><div class="wave">${Array.from({length:12},()=>'<i></i>').join('')}</div><span class="pill">در حال ضبط</span><div class="pin">📌 سنجاق عکس در صورت نیاز</div></div></div></div></div>`;
if(scene===0)root.innerHTML=`<div class="stage">${chrome}<div class="copy"><div class="eyebrow">اعتماد، از یک گزارش روشن آغاز می‌شود</div><h1>از این به بعد ما<br><span>معتمد شماییم،</span><br>میثاق ۲</h1><div class="rule"></div><p>ثبت گزارش صوتی؛ سریع، روشن و امن.</p></div>${phone}</div>`;
else if(scene===1)root.innerHTML=`<div class="stage">${chrome}${phone}<div class="copy" style="right:1160px;top:315px;width:570px"><div class="eyebrow">مرحله اول</div><h1 style="font-size:57px">گزارش را<br><span>در چند ثانیه</span><br>آماده کنید.</h1><p>عنوان، فوریت و توضیح کوتاه؛ همین‌قدر ساده.</p></div></div>`;
else if(scene===2)root.innerHTML=`<div class="stage">${chrome}${phone}<div class="copy" style="right:1160px;top:315px;width:570px"><div class="eyebrow">مرحله دوم</div><h1 style="font-size:57px">صدای شما،<br><span>جزئیات واقعی</span><br>گزارش است.</h1><p>ضبط صدا و سنجاق عکس، بدون پیچیدگی.</p></div></div>`;
else if(scene===3)root.innerHTML=`<div class="stage">${chrome}<div class="success-card"><div class="check">✓</div><div class="eyebrow">ارسال امن</div><h2>گزارش شما دریافت شد.</h2><p style="font-size:21px;color:#718477">گزارش برای بررسی ثبت و کد پیگیری صادر شد.</p><div class="code">M2-جلسه</div></div><div class="notification"><strong>گزارش جدید ثبت شد</strong><span>یک گزارش صوتی برای بررسی شما آماده است.</span></div><div class="copy" style="right:1160px;top:315px;width:570px"><div class="eyebrow">مرحله سوم</div><h1 style="font-size:57px">اطمینان،<br><span>در هر ارسال</span><br>همراه شماست.</h1></div></div>`;
else root.innerHTML=`<div class="stage">${chrome}<div class="copy" style="right:360px;top:300px;width:1200px;text-align:center"><div class="eyebrow">میثاق ۲</div><h1 style="font-size:84px">از این به بعد ما معتمد شماییم</h1><div class="rule" style="margin:35px auto"></div><p style="font-size:34px">گزارش خود را روشن، سریع و امن ثبت کنید.</p></div><img src="${logo}" style="position:absolute;bottom:105px;left:calc(50% - 78px);width:156px;filter:drop-shadow(0 20px 25px #0009)"></div>`;
</script></body></html>
