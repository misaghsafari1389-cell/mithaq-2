<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=1280,height=720"><style>
*{box-sizing:border-box}html,body{margin:0;width:1280px;height:720px;overflow:hidden;font-family:Tahoma,Arial,sans-serif;background:#09271f;color:#f4ead5}.scene{width:100%;height:100%;position:relative;padding:58px 84px;background:radial-gradient(circle at 68% 12%,#1c5b43,#09271f 58%,#041b15)}.glow{position:absolute;width:420px;height:420px;border-radius:50%;background:#d6b66c18;filter:blur(30px);left:60px;bottom:-180px}.topline{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #d6b66c66;padding-bottom:18px}.brand{display:flex;align-items:center;gap:15px;font-size:30px;font-weight:800}.brand img{width:58px;height:58px;object-fit:contain}.tag{color:#d6b66c;font-size:20px}.headline{font-size:54px;line-height:1.5;margin:110px 0 15px;max-width:900px}.sub{font-size:26px;color:#c5d9c9;line-height:1.8}.gold{height:5px;width:160px;border-radius:5px;background:#d6b66c;margin-top:28px}.card{position:absolute;top:100px;left:84px;width:680px;background:#fffdf8;color:#16372e;border-radius:24px;padding:36px;box-shadow:0 22px 70px #0006;text-align:right}.card h2{margin:0 0 24px;color:#123b2e;font-size:34px}.row{display:grid;grid-template-columns:1.4fr .8fr;gap:16px}.field{display:grid;gap:8px}.field label{font-weight:700;color:#244c3d;font-size:18px}.input{height:54px;border:1px solid #d8ded4;border-radius:11px;padding:14px;background:#fff;font-size:18px}.recorder{margin-top:22px;background:#f0f4eb;border-radius:15px;padding:18px}.wave{height:62px;display:flex;align-items:center;gap:5px;justify-content:center}.wave i{display:block;width:6px;border-radius:6px;background:#1b6348}.wave i:nth-child(1){height:20px}.wave i:nth-child(2){height:36px}.wave i:nth-child(3){height:52px}.wave i:nth-child(4){height:30px}.wave i:nth-child(5){height:60px}.wave i:nth-child(6){height:42px}.wave i:nth-child(7){height:24px}.wave i:nth-child(8){height:48px}.wave i:nth-child(9){height:34px}.actions{display:flex;gap:10px;margin-top:12px}.btn{border:0;border-radius:11px;padding:12px 18px;background:#123b2e;color:white;font-weight:700;font-size:17px}.btn.goldbtn{background:#d6b66c;color:#09271f}.pin{color:#567264;font-size:16px;margin-top:14px}.success{position:absolute;inset:120px 260px;background:#fffdf8;color:#16372e;border-radius:26px;display:grid;place-items:center;text-align:center;padding:50px;box-shadow:0 24px 80px #0006}.check{width:86px;height:86px;border-radius:50%;display:grid;place-items:center;background:#dfece1;color:#286049;font-size:54px;margin:auto}.success h2{font-size:42px;color:#123b2e;margin:18px 0 8px}.success p{font-size:22px;color:#718477}.code{display:inline-block;background:#f0f4eb;border-radius:12px;padding:15px 28px;color:#123b2e;font-size:28px;letter-spacing:4px;margin-top:12px}
</style></head><body><div id="root"></div><script>
const root=document.querySelector('#root');const scene=new URLSearchParams(location.search).get('scene')||'intro';const logo='../assets/mithaq2-icon-192.png';
const topbar=`<div class="topline"><div class="brand"><img src="${logo}"><span>میثاق ۲</span></div><div class="tag">سامانه رسمی ثبت گزارش صوتی</div></div><div class="glow"></div>`;
if(scene==='form')root.innerHTML=`<div class="scene">${topbar}<div class="card"><h2>ثبت گزارش جدید</h2><div class="row"><div class="field"><label>عنوان گزارش *</label><div class="input">ثبت گزارش جلسه</div></div><div class="field"><label>سطح فوریت *</label><div class="input">ضروری</div></div></div><div class="recorder"><div class="field"><label>صدای خود را ضبط کنید *</label><div class="wave">${Array.from({length:9},()=>'<i></i>').join('')}</div></div><div class="actions"><button class="btn">توقف ضبط</button><button class="btn goldbtn">ارسال گزارش</button></div><div class="pin">📌 سنجاق عکس در صورت نیاز</div></div></div><h1 class="headline" style="position:absolute;right:820px;top:170px;width:360px;font-size:42px">گزارش شما<br>سریع و امن<br>ثبت می‌شود.</h1></div>`;
else if(scene==='success')root.innerHTML=`<div class="scene">${topbar}<div class="success"><div><div class="check">✓</div><h2>گزارش شما دریافت شد.</h2><p>گزارش با موفقیت برای بررسی امن ارسال شد.</p><div class="code">M2-جلسه</div></div></div></div>`;
else root.innerHTML=`<div class="scene">${topbar}<h1 class="headline">از این به بعد ما معتمد شماییم،<br><span style="color:#d6b66c">میثاق ۲</span></h1><div class="gold"></div><p class="sub">گزارش خود را روشن، سریع و امن ثبت کنید.</p></div>`;
</script></body></html>
